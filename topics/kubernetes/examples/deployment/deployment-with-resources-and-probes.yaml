---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-with-resources-and-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-probed
  template:
    metadata:
      labels:
        app: nginx-probed
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
