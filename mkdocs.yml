site_name: cookbook
site_description: >-
  CI-validated notes and runnable examples for infrastructure and AI tooling.
site_url: https://xudipta.github.io/cookbook/
repo_url: https://github.com/xudipta/cookbook
repo_name: xudipta/cookbook
edit_uri: edit/main/

# site-src/ is assembled from the repo by scripts/build_docs.sh (topic notes
# live under topics/<topic>/, not in a single docs tree).
docs_dir: site-src

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/book-open-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Fonts are loaded in extra_css below (Archivo, Public Sans, IBM Plex Mono) and set in docs/site/material.css.
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search

# Site design tokens (docs/site/), then the shared shell for the browser games under docs/games/
# (see CONTRIBUTING.md, "Adding a game").
extra_css:
  - https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap
  - docs/site/tokens.css
  - docs/site/material.css
  - docs/games/shared/shell.css

extra_javascript:
  - path: docs/games/shared/boot.js
    type: module

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xudipta/cookbook
      name: xudipta/cookbook on GitHub

nav:
  - Home: README.md
  - Project:
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
  - Infrastructure:
      - docs/infrastructure.md
      - Kubernetes:
          - Overview: topics/kubernetes/README.md
          - kubectl commands: topics/kubernetes/notes/01-kubectl-commands.md
          - Pods and workloads: topics/kubernetes/notes/02-pods-and-workloads.md
          - Config and secrets: topics/kubernetes/notes/03-config-and-secrets.md
          - Services and networking: topics/kubernetes/notes/04-services-and-networking.md
          - SecurityContext: topics/kubernetes/notes/05-security-context.md
          - Helm and Kustomize: topics/kubernetes/notes/06-helm-and-kustomize.md
          - Probes and resources: topics/kubernetes/notes/07-probes-and-resources.md
      - Docker:
          - Overview: topics/docker/README.md
          - Images and Dockerfiles: topics/docker/notes/01-images-and-dockerfiles.md
          - Multi-stage builds and caching: topics/docker/notes/02-multi-stage-builds-and-caching.md
          - Compose and networking: topics/docker/notes/03-compose-and-networking.md
      - Terraform:
          - Overview: topics/terraform/README.md
          - Core workflow: topics/terraform/notes/01-core-workflow.md
          - Variables and modules: topics/terraform/notes/02-variables-and-modules.md
          - State and workspaces: topics/terraform/notes/03-state-and-workspaces.md
      - Linux:
          - Overview: topics/linux/README.md
          - Shell fundamentals: topics/linux/notes/01-shell-fundamentals.md
          - Text processing: topics/linux/notes/02-text-processing.md
          - systemd and networking: topics/linux/notes/03-systemd-and-networking.md
  - Delivery:
      - docs/delivery.md
      - CI/CD:
          - Overview: topics/cicd/README.md
          - GitHub Actions basics: topics/cicd/notes/01-github-actions-basics.md
          - Workflow patterns: topics/cicd/notes/02-workflow-patterns.md
          - Deployment strategies: topics/cicd/notes/03-deployment-strategies.md
      - GitHub:
          - Overview: topics/github/README.md
          - Git fundamentals: topics/github/notes/01-git-fundamentals.md
          - GitHub CLI and PRs: topics/github/notes/02-github-cli-and-prs.md
          - Repo configuration: topics/github/notes/03-repo-configuration.md
  - Operations:
      - docs/operations.md
      - Observability:
          - Overview: topics/observability/README.md
          - Prometheus basics: topics/observability/notes/01-prometheus-basics.md
          - Alerting and rules: topics/observability/notes/02-alerting-and-rules.md
          - Grafana and dashboards: topics/observability/notes/03-grafana-and-dashboards.md
      - Database:
          - Overview: topics/database/README.md
          - Schema design and normalization: topics/database/notes/01-schema-design-and-normalization.md
          - Migrations: topics/database/notes/02-migrations.md
          - Queries and indexing: topics/database/notes/03-queries-and-indexing.md
  - AI Tooling:
      - docs/ai-tooling.md
      - Agent Skills:
          - Overview: topics/skills/README.md
          - What are Agent Skills: topics/skills/notes/01-what-are-agent-skills.md
          - Authoring a skill: topics/skills/notes/02-authoring-skills.md
          - Skills in Claude Code: topics/skills/notes/03-skills-in-claude-code.md
      - MCP:
          - Overview: topics/mcp/README.md
          - Protocol overview: topics/mcp/notes/01-mcp-overview.md
          - MCP in Claude Code: topics/mcp/notes/02-mcp-in-claude-code.md
          - Building a server: topics/mcp/notes/03-building-a-server.md
  - Capstone:
      - Overview: topics/capstone/README.md
      - Ship a monitored service: topics/capstone/notes/01-ship-a-monitored-service.md
  - Play:
      - docs/games/index.md
      - Chaos Monkey Cluster (Kubernetes): docs/games/kubernetes/index.md
      - Layer Cake (Docker): docs/games/docker/index.md
      - Drift Detective (Terraform): docs/games/terraform/index.md
      - Replica Rescue (demo): docs/games/demo/index.md
