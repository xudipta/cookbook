site_name: cookbook
site_description: >-
  CI-validated notes and runnable examples for infrastructure and AI tooling.
site_url: https://xudipta.github.io/cookbook/
repo_url: https://github.com/xudipta/cookbook
repo_name: xudipta/cookbook
edit_uri: edit/main/

# site-src/ is assembled from the repo by scripts/build_docs.sh (topic notes
# live under topics/<topic>/, not in a single docs tree).
docs_dir: site-src

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/chef-hat
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xudipta/cookbook
      name: xudipta/cookbook on GitHub

nav:
  - Home: README.md
  - Contributing: CONTRIBUTING.md
  - Kubernetes:
      - Overview: topics/kubernetes/README.md
      - kubectl commands: topics/kubernetes/notes/01-kubectl-commands.md
      - Pods and workloads: topics/kubernetes/notes/02-pods-and-workloads.md
      - Config and secrets: topics/kubernetes/notes/03-config-and-secrets.md
      - Services and networking: topics/kubernetes/notes/04-services-and-networking.md
      - SecurityContext: topics/kubernetes/notes/05-security-context.md
      - Helm and Kustomize: topics/kubernetes/notes/06-helm-and-kustomize.md
  - Docker:
      - Overview: topics/docker/README.md
      - Images and Dockerfiles: topics/docker/notes/01-images-and-dockerfiles.md
      - Multi-stage builds and caching: topics/docker/notes/02-multi-stage-builds-and-caching.md
      - Compose and networking: topics/docker/notes/03-compose-and-networking.md
  - Linux:
      - Overview: topics/linux/README.md
      - Shell fundamentals: topics/linux/notes/01-shell-fundamentals.md
