name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      md: ${{ steps.filter.outputs.md }}
      yaml: ${{ steps.filter.outputs.yaml }}
      k8s: ${{ steps.filter.outputs.k8s }}
      docker: ${{ steps.filter.outputs.docker }}
      shell: ${{ steps.filter.outputs.shell }}
      linux: ${{ steps.filter.outputs.linux }}
      terraform: ${{ steps.filter.outputs.terraform }}
      cicd: ${{ steps.filter.outputs.cicd }}
      skills: ${{ steps.filter.outputs.skills }}
      mcp: ${{ steps.filter.outputs.mcp }}
      observability: ${{ steps.filter.outputs.observability }}
      database: ${{ steps.filter.outputs.database }}
      docs: ${{ steps.filter.outputs.docs }}
      games: ${{ steps.filter.outputs.games }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            md:
              - '**/*.md'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint.yaml'
            k8s:
              - 'topics/kubernetes/**'
            docker:
              - 'topics/docker/**'
            shell:
              - '**/*.sh'
            linux:
              - 'topics/linux/**'
            terraform:
              - 'topics/terraform/**'
            cicd:
              - 'topics/cicd/**'
            skills:
              - 'topics/skills/**'
              - 'scripts/check_skill.py'
            mcp:
              - 'topics/mcp/**'
            observability:
              - 'topics/observability/**'
            database:
              - 'topics/database/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              - 'scripts/build_docs.sh'
              - 'scripts/check_site_assets.py'
              - 'scripts/check_contrast.py'
              - 'scripts/check_site_urls.py'
              - 'scripts/site_urls.txt'
              - 'scripts/play_banners.py'
            games:
              - 'docs/games/**'
              - 'docs/site/**'
              - 'scripts/check_games.py'
              - 'scripts/check_skills_game.py'
              - 'scripts/check_skill.py'
              - 'scripts/games_smoke.cjs'
              - 'scripts/site_quality.cjs'
              - 'scripts/build_docs.sh'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              # Every game links into the notes by heading; renaming one must be caught here.
              - 'topics/**/*.md'

  markdownlint:
    needs: changes
    if: needs.changes.outputs.md == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.yaml
          globs: '**/*.md'

  link-check:
    needs: changes
    if: needs.changes.outputs.md == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal cross-references resolve
        run: python3 scripts/check_links.py

  yamllint:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yamllint
      - run: yamllint .

  k8s-validate:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/
      - name: Schema-validate plain manifests
        run: |
          kubeconform -summary -strict -verbose \
            -schema-location default \
            -ignore-filename-pattern '.*/examples/helm/.*' \
            -ignore-filename-pattern '.*/kustomization\.yaml$' \
            topics/kubernetes/examples/
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: helm lint + schema-validate the rendered chart
        run: |
          helm lint topics/kubernetes/examples/helm/sample-chart
          helm template test-release topics/kubernetes/examples/helm/sample-chart \
            | kubeconform -summary -strict -schema-location default
      - name: kubectl kustomize + schema-validate each overlay
        run: |
          for overlay in topics/kubernetes/examples/kustomize/overlays/*/; do
            echo "== $overlay =="
            kubectl kustomize "$overlay" | kubeconform -summary -strict -schema-location default
          done

  k8s-kind:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    env:
      K8S_EXAMPLES: topics/kubernetes/examples
    steps:
      - uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.9.0
        with:
          version: v0.20.0
          wait: 60s

      - name: Verify cluster
        run: kubectl cluster-info

      - name: Apply Secrets
        run: kubectl apply -f "$K8S_EXAMPLES/secrets/"

      - name: Apply ConfigMaps
        run: kubectl apply -f "$K8S_EXAMPLES/configs/"

      - name: Apply Deployments
        run: kubectl apply -f "$K8S_EXAMPLES/deployment/"

      - name: Apply Services
        run: kubectl apply -f "$K8S_EXAMPLES/services/"

      - name: Wait for Deployments
        run: kubectl wait --for=condition=available --timeout=60s deployment --all

      - name: Check resources
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo "=== Secrets ==="
          kubectl get secrets
          echo "=== ConfigMaps ==="
          kubectl get configmaps
          echo "=== Services ==="
          kubectl get svc -o wide
          echo "=== Endpoints ==="
          kubectl get endpoints

      - name: Test Service connectivity
        run: |
          echo "Testing service response..."
          kubectl run curl --rm -i --restart=Never --image=curlimages/curl:latest -- \
            sh -c "curl -s sample-service:80 | grep 'Welcome to nginx'"

      - name: Debug on failure
        if: failure()
        run: |
          echo "Service test failed - dumping debug info..."
          kubectl get pods -o wide
          kubectl logs -l app=nginx --tail=50 || true
          kubectl get svc -o wide
          kubectl get endpoints
          kubectl describe deployment sample-deployment || true
          kubectl describe svc sample-service || true

  docker-lint:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: 'topics/docker/**/Dockerfile*'

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hello-nginx topics/docker/examples/hello-nginx
      - name: Run and wait for readiness
        run: |
          docker run -d --name hello-nginx -p 8080:80 hello-nginx
          timeout 30 sh -c 'until curl -sf http://localhost:8080 >/dev/null; do sleep 1; done'
      - name: Verify response content
        run: curl -sf http://localhost:8080 | grep -q 'hello from the cookbook'
      - name: Debug on failure
        if: failure()
        run: docker logs hello-nginx || true
      - name: Clean up
        if: always()
        run: docker rm -f hello-nginx || true

  shell-lint:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          mapfile -t files < <(find topics scripts -type f -name '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  linux-smoke:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the README Quickstart for real
        run: |
          mkdir -p /tmp/demo/src
          echo "hello" > /tmp/demo/src/file.txt
          topics/linux/examples/scripts/backup.sh /tmp/demo/src /tmp/demo/dest
          tar -tzf /tmp/demo/dest/src-*.tar.gz | grep -q 'src/file.txt'

  terraform-validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive topics/terraform
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: topics/terraform
        run: tflint --recursive

  terraform-apply:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform init + apply
        working-directory: topics/terraform/examples/local-file
        run: |
          terraform init
          terraform apply -auto-approve
      - name: Verify output file
        working-directory: topics/terraform/examples/local-file
        run: |
          test -f greeting.txt
          grep -q 'hello from the cookbook' greeting.txt
      - name: terraform destroy
        if: always()
        working-directory: topics/terraform/examples/local-file
        run: terraform destroy -auto-approve

  actionlint:
    needs: changes
    if: needs.changes.outputs.cicd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color topics/cicd/examples/workflows/*.yml

  skills-validate:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Validate SKILL.md files
        run: |
          mapfile -t files < <(find topics -type f -name 'SKILL.md')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SKILL.md files found."
            exit 0
          fi
          python scripts/check_skill.py "${files[@]}"

  mcp-validate:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON config examples
        run: |
          mapfile -t files < <(find topics/mcp/examples -type f \( -name '*.json' -o -name '.mcp.json' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JSON files found."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            jq empty "$f"
          done

  observability-validate:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSLo prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          tar xf prometheus.tar.gz prometheus-2.54.1.linux-amd64/promtool
          sudo install prometheus-2.54.1.linux-amd64/promtool /usr/local/bin/
      - name: promtool check config + rules
        run: |
          promtool check config topics/observability/examples/prometheus/prometheus.yml
          promtool check rules topics/observability/examples/prometheus/rules.yml
      - name: Validate Grafana dashboard JSON
        run: jq empty topics/observability/examples/grafana/dashboard.json

  database-validate:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install sqlfluff
      - name: sqlfluff lint
        run: sqlfluff lint topics/database/examples/

  database-migrate:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema.sql directly
        run: psql -v ON_ERROR_STOP=1 -f topics/database/examples/schema/schema.sql
      - name: Reset database
        run: psql -c 'DROP TABLE IF EXISTS order_items, orders, products, users CASCADE;'
      - name: Apply migrations up, in order
        run: |
          mapfile -t files < <(find topics/database/examples/migrations -name '*.up.sql' | sort)
          for f in "${files[@]}"; do
            echo "== $f =="
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify tables exist
        run: psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | grep -q '^4$'
      - name: Roll back migrations down, in reverse order
        run: |
          mapfile -t files < <(find topics/database/examples/migrations -name '*.down.sql' | sort -r)
          for f in "${files[@]}"; do
            echo "== $f =="
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify tables are gone
        run: psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | grep -q '^0$'

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt
      - run: bash scripts/build_docs.sh
      - name: Build site (strict)
        run: mkdocs build --strict --site-dir _site
      - name: Check every local asset the pages reference was published
        run: python3 scripts/check_site_assets.py _site
      - name: Check every previously published page still exists
        run: python3 scripts/check_site_urls.py _site
      - name: Check the design tokens meet WCAG AA in both themes
        run: python3 scripts/check_contrast.py

  games-smoke:
    needs: changes
    if: needs.changes.outputs.games == 'true'
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate game scenarios
        run: python3 scripts/check_games.py
      - run: pip install -r requirements-docs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the Agent Skills game's lint gate against scripts/check_skill.py
        run: python3 scripts/check_skills_game.py
      - name: Build the docs site
        run: |
          bash scripts/build_docs.sh
          mkdocs build --strict --site-dir _site
      - name: actionlint the workflow YAML the CI/CD game generates
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          PATH="$PWD:$PATH" node docs/games/cicd/lint-yaml.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 axe-core@4.10.2
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play every game, then check layout and accessibility on the built site
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SITE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 --directory _site >/dev/null 2>&1 &
          timeout 30 sh -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 1; done'
          node scripts/games_smoke.cjs
          node scripts/site_quality.cjs
